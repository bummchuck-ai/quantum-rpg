<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-elom" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(187, 57%, 39%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(217, 27%, 7%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-elom" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(37, 87%, 37%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(37, 87%, 37%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(217, 27%, 7%)"/>
  <rect width="100" height="100" fill="url(#bg-elom)"/>
  <circle cx="17" cy="58" r="8" fill="none" stroke="hsl(37, 87%, 37%)" stroke-width="0.2" opacity="0.08"/><circle cx="29" cy="64" r="13" fill="none" stroke="hsl(37, 87%, 37%)" stroke-width="0.2" opacity="0.08"/><circle cx="82" cy="91" r="18" fill="none" stroke="hsl(37, 87%, 37%)" stroke-width="0.2" opacity="0.08"/><circle cx="95" cy="97" r="23" fill="none" stroke="hsl(37, 87%, 37%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-elom)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37" rx="20" ry="19" fill="hsl(187, 57%, 39%)" opacity="0.9"/>
  <ellipse cx="50" cy="37" rx="19" ry="18" fill="hsl(217, 27%, 7%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="64" rx="28" ry="12" fill="hsl(187, 57%, 39%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <polygon points="44,18 42,8 46,8" fill="hsl(37, 87%, 37%)" opacity="0.8"/><polygon points="50,18 48,8 52,8" fill="hsl(37, 87%, 37%)" opacity="0.8"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  <ellipse cx="56" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(188, 88%, 69%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(188, 88%, 69%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="83" width="8" height="9" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="86" width="8" height="6" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-elom)" opacity="0.3"/>
</svg>