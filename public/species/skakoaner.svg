  <circle cx="59" cy="61" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="79" cy="80" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="89" cy="90" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="44" cy="95" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="22" cy="47" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="61" cy="23" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="80" cy="61" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="90" cy="30" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="95" cy="65" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/><circle cx="47" cy="82" r="0.5" fill="hsl(322, 62%, 65%)" opacity="0.15"/>

