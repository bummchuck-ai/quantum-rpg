<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-droide" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(121, 31%, 35%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(29, 19%, 5%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-droide" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(209, 59%, 35%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(209, 59%, 35%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(29, 19%, 5%)"/>
  <rect width="100" height="100" fill="url(#bg-droide)"/>
  <circle cx="69" cy="84" r="8" fill="none" stroke="hsl(209, 59%, 35%)" stroke-width="0.2" opacity="0.08"/><circle cx="42" cy="21" r="13" fill="none" stroke="hsl(209, 59%, 35%)" stroke-width="0.2" opacity="0.08"/><circle cx="60" cy="80" r="18" fill="none" stroke="hsl(209, 59%, 35%)" stroke-width="0.2" opacity="0.08"/><circle cx="90" cy="95" r="23" fill="none" stroke="hsl(209, 59%, 35%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-droide)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="36.5" rx="16" ry="17.5" fill="hsl(121, 31%, 35%)" opacity="0.9"/>
  <ellipse cx="50" cy="36.5" rx="15" ry="16.5" fill="hsl(29, 19%, 5%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="62" rx="24" ry="12" fill="hsl(121, 31%, 35%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  
      <rect x="36" y="21" width="28" height="31" rx="4" fill="none" stroke="hsl(120, 60%, 65%)" stroke-width="0.5" opacity="0.6"/>
      <line x1="42" y1="49" x2="58" y2="49" stroke="hsl(120, 60%, 65%)" stroke-width="1" opacity="0.8"/>
      <circle cx="50" cy="37" r="7" fill="none" stroke="hsl(120, 60%, 65%)" stroke-width="0.8"/>
      <rect x="35" y="16" width="30" height="3" rx="1" fill="hsl(121, 31%, 35%)" opacity="0.5"/>
    

  <!-- Eyes -->
  <ellipse cx="45" cy="37" rx="5" ry="3.5" fill="hsl(120, 60%, 65%)"/>
  <ellipse cx="55" cy="37" rx="5" ry="3.5" fill="hsl(120, 60%, 65%)"/>
  
  <circle cx="45" cy="37" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="55" cy="37" r="1.5" fill="white" opacity="0.9"/>
  

  <!-- Stat bars -->
  <rect x="8" y="89" width="8" height="3" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="89" width="8" height="3" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="89" width="8" height="3" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="89" width="8" height="3" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="89" width="8" height="3" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-droide)" opacity="0.3"/>
</svg>