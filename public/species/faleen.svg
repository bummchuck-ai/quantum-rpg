<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-faleen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(347, 57%, 21%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(137, 27%, 10%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-faleen" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(317, 87%, 54%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(317, 87%, 54%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(137, 27%, 10%)"/>
  <rect width="100" height="100" fill="url(#bg-faleen)"/>
  <circle cx="37" cy="18" r="8" fill="none" stroke="hsl(317, 87%, 54%)" stroke-width="0.2" opacity="0.08"/><circle cx="59" cy="79" r="13" fill="none" stroke="hsl(317, 87%, 54%)" stroke-width="0.2" opacity="0.08"/><circle cx="39" cy="69" r="18" fill="none" stroke="hsl(317, 87%, 54%)" stroke-width="0.2" opacity="0.08"/><circle cx="84" cy="42" r="23" fill="none" stroke="hsl(317, 87%, 54%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-faleen)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37" rx="16" ry="19" fill="hsl(347, 57%, 21%)" opacity="0.9"/>
  <ellipse cx="50" cy="37" rx="15" ry="18" fill="hsl(137, 27%, 10%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="64" rx="24" ry="12" fill="hsl(347, 57%, 21%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  <ellipse cx="56" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(348, 88%, 51%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(348, 88%, 51%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="89" width="8" height="3" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="86" width="8" height="6" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="83" width="8" height="9" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-faleen)" opacity="0.3"/>
</svg>