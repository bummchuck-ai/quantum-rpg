<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-drall" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(285, 35%, 30%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(255, 25%, 11%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-drall" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(75, 85%, 42%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(75, 85%, 42%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(255, 25%, 11%)"/>
  <rect width="100" height="100" fill="url(#bg-drall)"/>
  <circle cx="75" cy="33" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="37" cy="16" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="68" cy="8" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="34" cy="54" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="67" cy="77" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="33" cy="38" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="16" cy="69" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="8" cy="84" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="54" cy="92" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/><circle cx="77" cy="46" r="0.5" fill="hsl(286, 66%, 60%)" opacity="0.15"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-drall)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="38" rx="16" ry="22" fill="hsl(285, 35%, 30%)" opacity="0.9"/>
  <ellipse cx="50" cy="38" rx="15" ry="21" fill="hsl(255, 25%, 11%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="68" rx="24" ry="12" fill="hsl(285, 35%, 30%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="9" ry="6.3" fill="#111"/>
  <ellipse cx="56" cy="36" rx="9" ry="6.3" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="4.5" ry="3.6" fill="hsl(286, 66%, 60%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="4.5" ry="3.6" fill="hsl(286, 66%, 60%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="1.3499999999999999" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="1.3499999999999999" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="89" width="8" height="3" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="89" width="8" height="3" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="80" width="8" height="12" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-drall)" opacity="0.3"/>
</svg>