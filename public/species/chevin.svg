<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-chevin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(355, 65%, 32%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(335, 25%, 8%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-chevin" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(155, 85%, 44%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(155, 85%, 44%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(335, 25%, 8%)"/>
  <rect width="100" height="100" fill="url(#bg-chevin)"/>
  <circle cx="55" cy="4" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="77" cy="2" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="38" cy="51" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="19" cy="75" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="9" cy="87" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="4" cy="43" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="2" cy="21" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="51" cy="10" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="75" cy="55" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="87" cy="27" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-chevin)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37" rx="20" ry="19" fill="hsl(355, 65%, 32%)" opacity="0.9"/>
  <ellipse cx="50" cy="37" rx="19" ry="18" fill="hsl(335, 25%, 8%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="64" rx="28" ry="12" fill="hsl(355, 65%, 32%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <polygon points="44,18 42,10 46,10" fill="hsl(155, 85%, 44%)" opacity="0.8"/><polygon points="50,18 48,10 52,10" fill="hsl(155, 85%, 44%)" opacity="0.8"/><rect x="55" y="35" width="2" height="1" rx="0.5" fill="hsl(354, 94%, 62%)" opacity="0.6"/><rect x="59" y="37" width="4" height="1" rx="0.5" fill="hsl(354, 94%, 62%)" opacity="0.6"/><rect x="42" y="37" width="5" height="1" rx="0.5" fill="hsl(354, 94%, 62%)" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  <ellipse cx="57" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="43" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(354, 94%, 62%)" opacity="0.9"/>
  <ellipse cx="57" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(354, 94%, 62%)" opacity="0.9"/>
  <circle cx="44" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  <circle cx="58" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="83" width="8" height="9" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="89" width="8" height="3" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="86" width="8" height="6" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="83" width="8" height="9" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-chevin)" opacity="0.3"/>
</svg>