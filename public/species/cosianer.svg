<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-cosianer" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(340, 50%, 23%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(128, 18%, 7%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-cosianer" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(308, 78%, 39%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(308, 78%, 39%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(128, 18%, 7%)"/>
  <rect width="100" height="100" fill="url(#bg-cosianer)"/>
  <polygon points="8,84 11.5,86 11.5,90 8,92 4.5,90 4.5,86" fill="none" stroke="hsl(308, 78%, 39%)" stroke-width="0.3" opacity="0.1"/><polygon points="54,40 57.5,42 57.5,46 54,48 50.5,46 50.5,42" fill="none" stroke="hsl(308, 78%, 39%)" stroke-width="0.3" opacity="0.1"/><polygon points="77,68 80.5,70 80.5,74 77,76 73.5,74 73.5,70" fill="none" stroke="hsl(308, 78%, 39%)" stroke-width="0.3" opacity="0.1"/><polygon points="88,82 91.5,84 91.5,88 88,90 84.5,88 84.5,84" fill="none" stroke="hsl(308, 78%, 39%)" stroke-width="0.3" opacity="0.1"/><polygon points="44,39 47.5,41 47.5,45 44,47 40.5,45 40.5,41" fill="none" stroke="hsl(308, 78%, 39%)" stroke-width="0.3" opacity="0.1"/><polygon points="72,67 75.5,69 75.5,73 72,75 68.5,73 68.5,69" fill="none" stroke="hsl(308, 78%, 39%)" stroke-width="0.3" opacity="0.1"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-cosianer)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37.5" rx="16" ry="20.5" fill="hsl(340, 50%, 23%)" opacity="0.9"/>
  <ellipse cx="50" cy="37.5" rx="15" ry="19.5" fill="hsl(128, 18%, 7%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="66" rx="24" ry="12" fill="hsl(340, 50%, 23%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="8" ry="5.6" fill="#111"/>
  <ellipse cx="56" cy="36" rx="8" ry="5.6" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="4" ry="3.2" fill="hsl(341, 81%, 53%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="4" ry="3.2" fill="hsl(341, 81%, 53%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="89" width="8" height="3" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="83" width="8" height="9" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-cosianer)" opacity="0.3"/>
