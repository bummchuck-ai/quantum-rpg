  <ellipse cx="56" cy="35" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="44" cy="35" rx="3" ry="2.4000000000000004" fill="hsl(142, 82%, 56%)" opacity="0.9"/>
  <ellipse cx="56" cy="35" rx="3" ry="2.4000000000000004" fill="hsl(142, 82%, 56%)" opacity="0.9"/>
  <circle cx="45" cy="34.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  <circle cx="57" cy="34.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  

