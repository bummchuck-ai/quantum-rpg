<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-pau-aner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(143, 53%, 26%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(75, 25%, 5%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-pau-aner" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(255, 65%, 50%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(255, 65%, 50%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(75, 25%, 5%)"/>
  <rect width="100" height="100" fill="url(#bg-pau-aner)"/>
  <circle cx="15" cy="87" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="7" cy="93" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="3" cy="46" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="51" cy="73" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="75" cy="86" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="87" cy="93" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="93" cy="46" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="46" cy="23" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="73" cy="61" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/><circle cx="86" cy="80" r="0.5" fill="hsl(142, 82%, 56%)" opacity="0.15"/>

