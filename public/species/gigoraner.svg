<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-gigoraner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(134, 44%, 33%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(98, 28%, 7%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-gigoraner" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(278, 88%, 44%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(278, 88%, 44%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(98, 28%, 7%)"/>
  <rect width="100" height="100" fill="url(#bg-gigoraner)"/>
  <line x1="-10" y1="0" x2="10" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="5" y1="0" x2="25" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="20" y1="0" x2="40" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="35" y1="0" x2="55" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="50" y1="0" x2="70" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="65" y1="0" x2="85" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="80" y1="0" x2="100" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/><line x1="95" y1="0" x2="115" y2="100" stroke="hsl(278, 88%, 44%)" stroke-width="0.2" opacity="0.06"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-gigoraner)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="36.5" rx="20" ry="17.5" fill="hsl(134, 44%, 33%)" opacity="0.9"/>
  <ellipse cx="50" cy="36.5" rx="19" ry="16.5" fill="hsl(98, 28%, 7%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="62" rx="28" ry="12" fill="hsl(134, 44%, 33%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <polygon points="44,19 42,8 46,8" fill="hsl(278, 88%, 44%)" opacity="0.8"/><polygon points="50,19 48,8 52,8" fill="hsl(278, 88%, 44%)" opacity="0.8"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="5" ry="3.5" fill="#111"/>
  <ellipse cx="56" cy="36" rx="5" ry="3.5" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="2.5" ry="2" fill="hsl(135, 75%, 63%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="2.5" ry="2" fill="hsl(135, 75%, 63%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="0.75" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="0.75" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="83" width="8" height="9" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="89" width="8" height="3" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-gigoraner)" opacity="0.3"/>
</svg>