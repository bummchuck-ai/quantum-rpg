<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-gotal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(353, 63%, 32%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(83, 13%, 5%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-gotal" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(263, 73%, 36%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(263, 73%, 36%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(83, 13%, 5%)"/>
  <rect width="100" height="100" fill="url(#bg-gotal)"/>
  <circle cx="83" cy="80" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="91" cy="90" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="45" cy="95" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="22" cy="97" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="61" cy="48" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="80" cy="74" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="90" cy="87" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="95" cy="43" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="97" cy="21" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/><circle cx="48" cy="10" r="0.5" fill="hsl(354, 94%, 62%)" opacity="0.15"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-gotal)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37" rx="18" ry="19" fill="hsl(353, 63%, 32%)" opacity="0.9"/>
  <ellipse cx="50" cy="37" rx="17" ry="18" fill="hsl(83, 13%, 5%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="64" rx="26" ry="12" fill="hsl(353, 63%, 32%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <rect x="43" y="44" width="2" height="1" rx="0.5" fill="hsl(354, 94%, 62%)" opacity="0.6"/><rect x="42" y="35" width="4" height="1" rx="0.5" fill="hsl(354, 94%, 62%)" opacity="0.6"/><rect x="50" y="33" width="5" height="1" rx="0.5" fill="hsl(354, 94%, 62%)" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  <ellipse cx="57" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="43" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(354, 94%, 62%)" opacity="0.9"/>
  <ellipse cx="57" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(354, 94%, 62%)" opacity="0.9"/>
  <circle cx="44" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  <circle cx="58" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="86" width="8" height="6" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="83" width="8" height="9" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

