  <polygon points="0,8 3.5,10 3.5,14 0,16 -3.5,14 -3.5,10" fill="none" stroke="hsl(300, 70%, 41%)" stroke-width="0.3" opacity="0.1"/><polygon points="50,2 53.5,4 53.5,8 50,10 46.5,8 46.5,4" fill="none" stroke="hsl(300, 70%, 41%)" stroke-width="0.3" opacity="0.1"/><polygon points="25,49 28.5,51 28.5,55 25,57 21.5,55 21.5,51" fill="none" stroke="hsl(300, 70%, 41%)" stroke-width="0.3" opacity="0.1"/><polygon points="12,72 15.5,74 15.5,78 12,80 8.5,78 8.5,74" fill="none" stroke="hsl(300, 70%, 41%)" stroke-width="0.3" opacity="0.1"/><polygon points="6,84 9.5,86 9.5,90 6,92 2.5,90 2.5,86" fill="none" stroke="hsl(300, 70%, 41%)" stroke-width="0.3" opacity="0.1"/><polygon points="53,40 56.5,42 56.5,46 53,48 49.5,46 49.5,42" fill="none" stroke="hsl(300, 70%, 41%)" stroke-width="0.3" opacity="0.1"/>

