<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-mustafarianer" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(68, 58%, 29%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(120, 10%, 7%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-mustafarianer" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(300, 70%, 41%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(300, 70%, 41%)" stop-opacity="0"/>
