<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-gungan" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(308, 58%, 24%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(8, 18%, 9%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-gungan" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(188, 78%, 54%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(188, 78%, 54%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
