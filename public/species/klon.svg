  <ellipse cx="56" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(225, 85%, 51%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(225, 85%, 51%)" opacity="0.9"/>
