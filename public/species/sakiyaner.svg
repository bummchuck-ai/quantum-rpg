<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-sakiyaner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(1, 31%, 25%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(219, 29%, 11%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-sakiyaner" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(39, 89%, 47%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(39, 89%, 47%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(219, 29%, 11%)"/>
  <rect width="100" height="100" fill="url(#bg-sakiyaner)"/>
  <circle cx="19" cy="66" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="59" cy="83" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="29" cy="41" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="64" cy="20" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="32" cy="60" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="66" cy="30" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="83" cy="15" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="41" cy="7" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="20" cy="3" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/><circle cx="60" cy="1" r="0.5" fill="hsl(2, 62%, 55%)" opacity="0.15"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-sakiyaner)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37.5" rx="18" ry="20.5" fill="hsl(1, 31%, 25%)" opacity="0.9"/>
  <ellipse cx="50" cy="37.5" rx="17" ry="19.5" fill="hsl(219, 29%, 11%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="66" rx="26" ry="12" fill="hsl(1, 31%, 25%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="8" ry="5.6" fill="#111"/>
  <ellipse cx="56" cy="36" rx="8" ry="5.6" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="4" ry="3.2" fill="hsl(2, 62%, 55%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="4" ry="3.2" fill="hsl(2, 62%, 55%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="83" width="8" height="9" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

