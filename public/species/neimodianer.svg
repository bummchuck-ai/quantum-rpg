<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-neimodianer" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(203, 33%, 37%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(335, 25%, 7%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-neimodianer" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(155, 85%, 42%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(155, 85%, 42%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(335, 25%, 7%)"/>
  <rect width="100" height="100" fill="url(#bg-neimodianer)"/>
  <circle cx="15" cy="53" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="57" cy="76" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="28" cy="38" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="14" cy="19" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="7" cy="59" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="53" cy="79" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="76" cy="89" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="38" cy="94" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="19" cy="47" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/><circle cx="59" cy="73" r="0.5" fill="hsl(202, 62%, 67%)" opacity="0.15"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-neimodianer)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37.5" rx="16" ry="20.5" fill="hsl(203, 33%, 37%)" opacity="0.9"/>
  <ellipse cx="50" cy="37.5" rx="15" ry="19.5" fill="hsl(335, 25%, 7%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="66" rx="24" ry="12" fill="hsl(203, 33%, 37%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <rect x="55" y="36" width="3" height="1" rx="0.5" fill="hsl(202, 62%, 67%)" opacity="0.6"/><rect x="54" y="38" width="2" height="1" rx="0.5" fill="hsl(202, 62%, 67%)" opacity="0.6"/><rect x="56" y="42" width="4" height="1" rx="0.5" fill="hsl(202, 62%, 67%)" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="37" rx="8" ry="5.6" fill="#111"/>
  <ellipse cx="57" cy="37" rx="8" ry="5.6" fill="#111"/>
  
  <ellipse cx="43" cy="37" rx="4" ry="3.2" fill="hsl(202, 62%, 67%)" opacity="0.9"/>
  <ellipse cx="57" cy="37" rx="4" ry="3.2" fill="hsl(202, 62%, 67%)" opacity="0.9"/>
  <circle cx="44" cy="36.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="58" cy="36.5" r="1.2" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="89" width="8" height="3" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="83" width="8" height="9" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="83" width="8" height="9" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="89" width="8" height="3" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-neimodianer)" opacity="0.3"/>
</svg>