  <ellipse cx="57" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="43" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(81, 61%, 62%)" opacity="0.9"/>
