  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="5" ry="3.5" fill="#111"/>
  <ellipse cx="56" cy="36" rx="5" ry="3.5" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="2.5" ry="2" fill="hsl(37, 97%, 52%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="2.5" ry="2" fill="hsl(37, 97%, 52%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="0.75" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="0.75" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="83" width="8" height="9" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="89" width="8" height="3" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

