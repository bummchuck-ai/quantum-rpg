<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-karkarodon" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(36, 66%, 22%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(136, 26%, 9%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-karkarodon" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(316, 86%, 49%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(316, 86%, 49%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
