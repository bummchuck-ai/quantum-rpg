  <rect width="100" height="100" fill="url(#bg-karkarodon)"/>
  <polygon points="36,25 39.5,27 39.5,31 36,33 32.5,31 32.5,27" fill="none" stroke="hsl(316, 86%, 49%)" stroke-width="0.3" opacity="0.1"/><polygon points="18,10 21.5,12 21.5,16 18,18 14.5,16 14.5,12" fill="none" stroke="hsl(316, 86%, 49%)" stroke-width="0.3" opacity="0.1"/><polygon points="59,3 62.5,5 62.5,9 59,11 55.5,9 55.5,5" fill="none" stroke="hsl(316, 86%, 49%)" stroke-width="0.3" opacity="0.1"/><polygon points="29,-1 32.5,1 32.5,5 29,7 25.5,5 25.5,1" fill="none" stroke="hsl(316, 86%, 49%)" stroke-width="0.3" opacity="0.1"/><polygon points="14,-3 17.5,-1 17.5,3 14,5 10.5,3 10.5,-1" fill="none" stroke="hsl(316, 86%, 49%)" stroke-width="0.3" opacity="0.1"/><polygon points="7,46 10.5,48 10.5,52 7,54 3.5,52 3.5,48" fill="none" stroke="hsl(316, 86%, 49%)" stroke-width="0.3" opacity="0.1"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-karkarodon)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="36.5" rx="20" ry="17.5" fill="hsl(36, 66%, 22%)" opacity="0.9"/>
  <ellipse cx="50" cy="36.5" rx="19" ry="16.5" fill="hsl(136, 26%, 9%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="62" rx="28" ry="12" fill="hsl(36, 66%, 22%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
