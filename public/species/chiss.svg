<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-chiss" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(116, 66%, 37%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(296, 26%, 11%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-chiss" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(116, 86%, 37%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(116, 86%, 37%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(296, 26%, 11%)"/>
  <rect width="100" height="100" fill="url(#bg-chiss)"/>
  <polygon points="56,40 59.5,42 59.5,46 56,48 52.5,46 52.5,42" fill="none" stroke="hsl(116, 86%, 37%)" stroke-width="0.3" opacity="0.1"/><polygon points="78,18 81.5,20 81.5,24 78,26 74.5,24 74.5,20" fill="none" stroke="hsl(116, 86%, 37%)" stroke-width="0.3" opacity="0.1"/><polygon points="89,7 92.5,9 92.5,13 89,15 85.5,13 85.5,9" fill="none" stroke="hsl(116, 86%, 37%)" stroke-width="0.3" opacity="0.1"/><polygon points="44,51 47.5,53 47.5,57 44,59 40.5,57 40.5,53" fill="none" stroke="hsl(116, 86%, 37%)" stroke-width="0.3" opacity="0.1"/><polygon points="22,23 25.5,25 25.5,29 22,31 18.5,29 18.5,25" fill="none" stroke="hsl(116, 86%, 37%)" stroke-width="0.3" opacity="0.1"/><polygon points="11,9 14.5,11 14.5,15 11,17 7.5,15 7.5,11" fill="none" stroke="hsl(116, 86%, 37%)" stroke-width="0.3" opacity="0.1"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-chiss)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37.5" rx="18" ry="20.5" fill="hsl(116, 66%, 37%)" opacity="0.9"/>
  <ellipse cx="50" cy="37.5" rx="17" ry="19.5" fill="hsl(296, 26%, 11%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="66" rx="26" ry="12" fill="hsl(116, 66%, 37%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="8" ry="5.6" fill="#111"/>
  <ellipse cx="56" cy="36" rx="8" ry="5.6" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="4" ry="3.2" fill="hsl(117, 97%, 67%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="4" ry="3.2" fill="hsl(117, 97%, 67%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="83" width="8" height="9" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

