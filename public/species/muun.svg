<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-muun" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(31, 61%, 39%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(61, 11%, 6%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-muun" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(241, 51%, 45%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(241, 51%, 45%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(61, 11%, 6%)"/>
  <rect width="100" height="100" fill="url(#bg-muun)"/>
  <circle cx="81" cy="40" r="8" fill="none" stroke="hsl(241, 51%, 45%)" stroke-width="0.2" opacity="0.08"/><circle cx="20" cy="60" r="13" fill="none" stroke="hsl(241, 51%, 45%)" stroke-width="0.2" opacity="0.08"/><circle cx="30" cy="15" r="18" fill="none" stroke="hsl(241, 51%, 45%)" stroke-width="0.2" opacity="0.08"/><circle cx="57" cy="28" r="23" fill="none" stroke="hsl(241, 51%, 45%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-muun)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37.5" rx="18" ry="20.5" fill="hsl(31, 61%, 39%)" opacity="0.9"/>
  <ellipse cx="50" cy="37.5" rx="17" ry="19.5" fill="hsl(61, 11%, 6%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="66" rx="26" ry="12" fill="hsl(31, 61%, 39%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <rect x="41" y="34" width="5" height="1" rx="0.5" fill="hsl(32, 92%, 69%)" opacity="0.6"/><rect x="40" y="34" width="3" height="1" rx="0.5" fill="hsl(32, 92%, 69%)" opacity="0.6"/><rect x="57" y="34" width="2" height="1" rx="0.5" fill="hsl(32, 92%, 69%)" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="37" rx="8" ry="5.6" fill="#111"/>
  <ellipse cx="57" cy="37" rx="8" ry="5.6" fill="#111"/>
  
  <ellipse cx="43" cy="37" rx="4" ry="3.2" fill="hsl(32, 92%, 69%)" opacity="0.9"/>
  <ellipse cx="57" cy="37" rx="4" ry="3.2" fill="hsl(32, 92%, 69%)" opacity="0.9"/>
  <circle cx="44" cy="36.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="58" cy="36.5" r="1.2" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="83" width="8" height="9" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="83" width="8" height="9" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="89" width="8" height="3" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-muun)" opacity="0.3"/>
</svg>