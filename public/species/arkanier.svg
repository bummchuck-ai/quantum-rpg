<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-arkanier" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(143, 53%, 31%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(213, 23%, 9%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-arkanier" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(33, 83%, 42%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(33, 83%, 42%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(213, 23%, 9%)"/>
  <rect width="100" height="100" fill="url(#bg-arkanier)"/>
  <circle cx="33" cy="16" r="8" fill="none" stroke="hsl(33, 83%, 42%)" stroke-width="0.2" opacity="0.08"/><circle cx="8" cy="54" r="13" fill="none" stroke="hsl(33, 83%, 42%)" stroke-width="0.2" opacity="0.08"/><circle cx="27" cy="63" r="18" fill="none" stroke="hsl(33, 83%, 42%)" stroke-width="0.2" opacity="0.08"/><circle cx="81" cy="40" r="23" fill="none" stroke="hsl(33, 83%, 42%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-arkanier)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37.5" rx="18" ry="20.5" fill="hsl(143, 53%, 31%)" opacity="0.9"/>
  <ellipse cx="50" cy="37.5" rx="17" ry="19.5" fill="hsl(213, 23%, 9%)" opacity="0.3"/>

  <!-- Shoulders -->
