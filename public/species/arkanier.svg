  <!-- Decorations (horns, tails, markings) -->
  <line x1="38" y1="42" x2="39" y2="48" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="51" y1="50" x2="50" y2="56" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="43" y1="54" x2="42" y2="58" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="39" y1="35" x2="38" y2="38" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="52" y1="46" x2="53" y2="51" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="58" y1="31" x2="59" y2="37" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="46" y1="24" x2="47" y2="30" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="55" y1="41" x2="54" y2="45" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="45" y1="49" x2="44" y2="54" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="40" y1="53" x2="41" y2="57" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="52" y1="55" x2="53" y2="58" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/><line x1="58" y1="36" x2="59" y2="39" stroke="hsl(33, 83%, 42%)" stroke-width="0.5" opacity="0.3"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="35" rx="8" ry="5.6" fill="#111"/>
  <ellipse cx="56" cy="35" rx="8" ry="5.6" fill="#111"/>
  
  <ellipse cx="44" cy="35" rx="4" ry="3.2" fill="hsl(142, 82%, 61%)" opacity="0.9"/>
  <ellipse cx="56" cy="35" rx="4" ry="3.2" fill="hsl(142, 82%, 61%)" opacity="0.9"/>
  <circle cx="45" cy="34.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="57" cy="34.5" r="1.2" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="83" width="8" height="9" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="83" width="8" height="9" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="89" width="8" height="3" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-arkanier)" opacity="0.3"/>
</svg>