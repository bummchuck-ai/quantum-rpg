  <circle cx="77" cy="38" r="8" fill="none" stroke="hsl(117, 87%, 52%)" stroke-width="0.2" opacity="0.08"/><circle cx="69" cy="34" r="13" fill="none" stroke="hsl(117, 87%, 52%)" stroke-width="0.2" opacity="0.08"/><circle cx="17" cy="8" r="18" fill="none" stroke="hsl(117, 87%, 52%)" stroke-width="0.2" opacity="0.08"/><circle cx="4" cy="52" r="23" fill="none" stroke="hsl(117, 87%, 52%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
