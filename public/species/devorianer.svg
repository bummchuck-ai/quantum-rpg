<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-devorianer" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(267, 57%, 29%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(297, 27%, 10%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-devorianer" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(117, 87%, 52%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(117, 87%, 52%)" stop-opacity="0"/>
