<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-quarren" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(110, 60%, 36%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(94, 24%, 9%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-quarren" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(274, 84%, 54%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(274, 84%, 54%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(94, 24%, 9%)"/>
  <rect width="100" height="100" fill="url(#bg-quarren)"/>
  <line x1="-10" y1="0" x2="10" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="5" y1="0" x2="25" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="20" y1="0" x2="40" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="35" y1="0" x2="55" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="50" y1="0" x2="70" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="65" y1="0" x2="85" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="80" y1="0" x2="100" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/><line x1="95" y1="0" x2="115" y2="100" stroke="hsl(274, 84%, 54%)" stroke-width="0.2" opacity="0.06"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-quarren)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="36.5" rx="18" ry="17.5" fill="hsl(110, 60%, 36%)" opacity="0.9"/>
  <ellipse cx="50" cy="36.5" rx="17" ry="16.5" fill="hsl(94, 24%, 9%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="62" rx="26" ry="12" fill="hsl(110, 60%, 36%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <line x1="39" y1="42" x2="38" y2="48" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="52" y1="48" x2="53" y2="54" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="43" y1="33" x2="42" y2="39" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="54" y1="43" x2="55" y2="47" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="44" y1="48" x2="45" y2="51" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="54" y1="33" x2="55" y2="38" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="44" y1="43" x2="45" y2="49" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="54" y1="31" x2="55" y2="35" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="59" y1="25" x2="58" y2="28" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="47" y1="39" x2="46" y2="44" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="56" y1="46" x2="57" y2="52" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/><line x1="60" y1="50" x2="61" y2="56" stroke="hsl(274, 84%, 54%)" stroke-width="0.5" opacity="0.3"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="35" rx="5" ry="3.5" fill="#111"/>
  <ellipse cx="56" cy="35" rx="5" ry="3.5" fill="#111"/>
  
  <ellipse cx="44" cy="35" rx="2.5" ry="2" fill="hsl(109, 89%, 66%)" opacity="0.9"/>
  <ellipse cx="56" cy="35" rx="2.5" ry="2" fill="hsl(109, 89%, 66%)" opacity="0.9"/>
  <circle cx="45" cy="34.5" r="0.75" fill="white" opacity="0.8"/>
  <circle cx="57" cy="34.5" r="0.75" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="89" width="8" height="3" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="83" width="8" height="9" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-quarren)" opacity="0.3"/>
</svg>