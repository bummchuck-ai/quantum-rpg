<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-trandoshaner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(349, 59%, 26%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(249, 19%, 5%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-trandoshaner" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(69, 79%, 39%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(69, 79%, 39%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(249, 19%, 5%)"/>
  <rect width="100" height="100" fill="url(#bg-trandoshaner)"/>
  <circle cx="49" cy="74" r="8" fill="none" stroke="hsl(69, 79%, 39%)" stroke-width="0.2" opacity="0.08"/><circle cx="37" cy="68" r="13" fill="none" stroke="hsl(69, 79%, 39%)" stroke-width="0.2" opacity="0.08"/><circle cx="84" cy="92" r="18" fill="none" stroke="hsl(69, 79%, 39%)" stroke-width="0.2" opacity="0.08"/><circle cx="96" cy="48" r="23" fill="none" stroke="hsl(69, 79%, 39%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-trandoshaner)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37" rx="20" ry="19" fill="hsl(349, 59%, 26%)" opacity="0.9"/>
  <ellipse cx="50" cy="37" rx="19" ry="18" fill="hsl(249, 19%, 5%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="64" rx="28" ry="12" fill="hsl(349, 59%, 26%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <polygon points="44,18 42,8 46,8" fill="hsl(69, 79%, 39%)" opacity="0.8"/><polygon points="50,18 48,8 52,8" fill="hsl(69, 79%, 39%)" opacity="0.8"/>

  <!-- Eyes -->
