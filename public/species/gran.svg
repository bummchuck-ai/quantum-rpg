  <ellipse cx="55" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="45" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(153, 93%, 62%)" opacity="0.9"/>
  <ellipse cx="55" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(153, 93%, 62%)" opacity="0.9"/>
