<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bg-dathomirianer" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="hsl(157, 67%, 34%)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="hsl(129, 19%, 10%)" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-dathomirianer" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="hsl(309, 79%, 44%)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="hsl(309, 79%, 44%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="hsl(129, 19%, 10%)"/>
  <rect width="100" height="100" fill="url(#bg-dathomirianer)"/>
  <circle cx="9" cy="54" r="8" fill="none" stroke="hsl(309, 79%, 44%)" stroke-width="0.2" opacity="0.08"/><circle cx="77" cy="38" r="13" fill="none" stroke="hsl(309, 79%, 44%)" stroke-width="0.2" opacity="0.08"/><circle cx="69" cy="34" r="18" fill="none" stroke="hsl(309, 79%, 44%)" stroke-width="0.2" opacity="0.08"/><circle cx="17" cy="8" r="23" fill="none" stroke="hsl(309, 79%, 44%)" stroke-width="0.2" opacity="0.08"/>

  <!-- Ambient glow -->
  <ellipse cx="50" cy="42" rx="35" ry="30" fill="url(#glow-dathomirianer)"/>

  <!-- Head / Body silhouette -->
  <ellipse cx="50" cy="37" rx="18" ry="19" fill="hsl(157, 67%, 34%)" opacity="0.9"/>
  <ellipse cx="50" cy="37" rx="17" ry="18" fill="hsl(129, 19%, 10%)" opacity="0.3"/>

  <!-- Shoulders -->
  <ellipse cx="50" cy="64" rx="26" ry="12" fill="hsl(157, 67%, 34%)" opacity="0.7"/>

  <!-- Decorations (horns, tails, markings) -->
  <rect x="49" y="37" width="4" height="1" rx="0.5" fill="hsl(158, 98%, 64%)" opacity="0.6"/><rect x="58" y="41" width="3" height="1" rx="0.5" fill="hsl(158, 98%, 64%)" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  <ellipse cx="56" cy="36" rx="6" ry="4.199999999999999" fill="#111"/>
  
  <ellipse cx="44" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(158, 98%, 64%)" opacity="0.9"/>
  <ellipse cx="56" cy="36" rx="3" ry="2.4000000000000004" fill="hsl(158, 98%, 64%)" opacity="0.9"/>
  <circle cx="45" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  <circle cx="57" cy="35.5" r="0.8999999999999999" fill="white" opacity="0.8"/>
  

  <!-- Stat bars -->
  <rect x="8" y="86" width="8" height="6" rx="1" fill="#ef4444" opacity="0.25"/><rect x="22.5" y="86" width="8" height="6" rx="1" fill="#22c55e" opacity="0.25"/><rect x="37" y="86" width="8" height="6" rx="1" fill="#3b82f6" opacity="0.25"/><rect x="51.5" y="86" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.25"/><rect x="66" y="86" width="8" height="6" rx="1" fill="#a855f7" opacity="0.25"/><rect x="80.5" y="86" width="8" height="6" rx="1" fill="#ec4899" opacity="0.25"/>

  <!-- Vignette -->
  <rect width="100" height="100" fill="url(#bg-dathomirianer)" opacity="0.3"/>
</svg>