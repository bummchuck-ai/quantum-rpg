<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1">
<title>QUANTUM RPG — Trailer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', 'SF Mono', 'Fira Code', 'Courier New', monospace;
    color: #f59e0b;
    position: relative;
  }

  #scene {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
  }

  canvas#orb {
    position: absolute;
    z-index: 2;
  }

  canvas#stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 1080px;
    height: 1920px;
  }

  .layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
  }

  /* === TEXT STYLES === */
  .credit {
    font-size: 24px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(245, 158, 11, 0.6);
    text-align: center;
  }

  .title-quantum {
    font-size: 120px;
    font-weight: 900;
    letter-spacing: 20px;
    text-transform: uppercase;
    color: #f59e0b;
    text-shadow: 0 0 60px rgba(245, 158, 11, 0.5), 0 0 120px rgba(245, 158, 11, 0.2);
    text-align: center;
    line-height: 1;
  }

  .title-chronicles {
    font-size: 48px;
    font-weight: 400;
    letter-spacing: 30px;
    text-transform: uppercase;
    color: #06b6d4;
    text-shadow: 0 0 40px rgba(6, 182, 212, 0.4);
    text-align: center;
    margin-top: 10px;
  }

  .species-count {
    font-size: 72px;
    font-weight: 900;
    color: #f59e0b;
    text-shadow: 0 0 40px rgba(245, 158, 11, 0.5);
    text-align: center;
    letter-spacing: 4px;
  }

  .species-label {
    font-size: 32px;
    color: #06b6d4;
    letter-spacing: 12px;
    text-transform: uppercase;
    margin-top: 15px;
  }

  .glitch-text {
    font-size: 64px;
    font-weight: 900;
    color: #06b6d4;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-shadow: 0 0 40px rgba(6, 182, 212, 0.5);
    position: relative;
  }

  .glitch-text::before,
  .glitch-text::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glitch-active .glitch-text::before {
    color: #f59e0b;
    animation: glitch1 0.15s infinite;
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
  }

  .glitch-active .glitch-text::after {
    color: #ef4444;
    animation: glitch2 0.15s infinite;
    clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
  }

  @keyframes glitch1 {
    0% { transform: translate(0); }
    20% { transform: translate(-5px, 3px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, -2px); }
    80% { transform: translate(4px, 2px); }
    100% { transform: translate(0); }
  }

  @keyframes glitch2 {
    0% { transform: translate(0); }
    20% { transform: translate(4px, -2px); }
    40% { transform: translate(-4px, 3px); }
    60% { transform: translate(3px, 2px); }
    80% { transform: translate(-5px, -3px); }
    100% { transform: translate(0); }
  }

  .glitch-sub {
    font-size: 28px;
    color: rgba(245, 158, 11, 0.7);
    margin-top: 30px;
    letter-spacing: 3px;
    text-align: center;
    font-weight: 400;
  }

  .stat-line {
    font-size: 42px;
    font-weight: 700;
    text-align: center;
    margin: 20px 0;
    letter-spacing: 3px;
    opacity: 0;
  }

  .stat-num {
    color: #06b6d4;
    font-size: 64px;
    text-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
  }

  .stat-label {
    color: rgba(245, 158, 11, 0.8);
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .hero-text {
    font-size: 56px;
    font-weight: 900;
    text-align: center;
    line-height: 1.4;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .hero-text .amber { color: #f59e0b; text-shadow: 0 0 40px rgba(245, 158, 11, 0.4); }
  .hero-text .cyan { color: #06b6d4; text-shadow: 0 0 40px rgba(6, 182, 212, 0.4); }

  .manifesto {
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    line-height: 1.6;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f59e0b;
    text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
  }

  .final-title {
    font-size: 140px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #f59e0b;
    text-shadow: 0 0 80px rgba(245, 158, 11, 0.6), 0 0 160px rgba(245, 158, 11, 0.3);
    text-align: center;
    line-height: 1;
  }

  .final-rpg {
    font-size: 100px;
    font-weight: 900;
    letter-spacing: 40px;
    color: #06b6d4;
    text-shadow: 0 0 60px rgba(6, 182, 212, 0.5), 0 0 120px rgba(6, 182, 212, 0.2);
    text-align: center;
  }

  .final-url {
    font-size: 28px;
    color: rgba(245, 158, 11, 0.6);
    letter-spacing: 8px;
    margin-top: 40px;
    text-align: center;
  }

  /* === PORTRAIT STYLES === */
  .portrait-container {
    position: absolute;
    overflow: hidden;
    border: 2px solid rgba(245, 158, 11, 0.4);
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.2), inset 0 0 40px rgba(0,0,0,0.5);
  }

  .portrait-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.6) contrast(1.2);
  }

  .portrait-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  }

  .portrait-stat {
    position: absolute;
    bottom: 15px;
    left: 15px;
    font-size: 16px;
    color: #06b6d4;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }

  /* === SCAN LINES === */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 3px,
      rgba(0, 0, 0, 0.04) 3px,
      rgba(0, 0, 0, 0.04) 6px
    );
  }

  /* === VIGNETTE === */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 99;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }

  /* === FADE OVERLAY === */
  #fade-overlay {
    position: absolute;
    inset: 0;
    z-index: 200;
    background: #000;
    pointer-events: none;
  }

  /* === FLASH === */
  #flash {
    position: absolute;
    inset: 0;
    z-index: 150;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  /* Hero portrait */
  .hero-portrait {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0;
  }

  .hero-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.3) contrast(1.3) brightness(0.4);
  }

  .hero-portrait .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
  }
</style>
</head>
<body>
<div id="scene">
  <!-- Stars background canvas -->

  <!-- SCENE 1: Credit (0-3s) -->
  <div class="layer" id="s1">
    <div class="credit">Ein Fan-Projekt von</div>

<div style="display:none;">
  <img src="species/chiss.jpg" id="preChiss">
  <img src="species/twi-lek.jpg" id="preTwilek">
  <img src="species/togruta.jpg" id="preTogruta">
  <img src="species/mensch-mandalore.jpg" id="preMando">

<script>
// ============================================================
// QUANTUM RPG — CINEMATIC TRAILER
// ============================================================

const DURATION = 25;
const FPS = 60;

// --- HOLOCRON ORB ---
const orbCanvas = document.getElementById('orb');
const orbCtx = orbCanvas.getContext('2d');
const DOT_COUNT = 160;
const PULSE_SPEED = 0.8;

const dots = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < DOT_COUNT; i++) {
  dots.push({
    theta: Math.acos(1 - 2 * (i + 0.5) / DOT_COUNT),
    phi: goldenAngle * i,
    size: 1.5 + Math.random() * 2
  });
}

// Orb state
let orbX = 540, orbY = 960, orbSize = 500, orbOpacity = 0;

function drawOrb(time) {
  const dpr = 2;
  const s = orbSize;
  orbCanvas.width = s * dpr;
  orbCanvas.height = s * dpr;
  orbCanvas.style.width = s + 'px';
  orbCanvas.style.height = s + 'px';
  orbCanvas.style.left = (orbX - s / 2) + 'px';
  orbCanvas.style.top = (orbY - s / 2) + 'px';
  orbCanvas.style.opacity = orbOpacity;

  orbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  orbCtx.clearRect(0, 0, s, s);

  const cx = s / 2, cy = s / 2, radius = s * 0.35;
  const rotY = time * 0.5;
  const pulsePhase = time * PULSE_SPEED;

  const projected = dots.map(dot => {
    const x3d = Math.sin(dot.theta) * Math.cos(dot.phi + rotY);
    const y3d = Math.cos(dot.theta);
    const z3d = Math.sin(dot.theta) * Math.sin(dot.phi + rotY);
    const tilt = 0.3;
    const y3dt = y3d * Math.cos(tilt) - z3d * Math.sin(tilt);
    const z3dt = y3d * Math.sin(tilt) + z3d * Math.cos(tilt);
    const persp = 1 + z3dt * 0.3;
    const pulseWave = Math.sin(dot.theta * 3 - pulsePhase * Math.PI * 2);
    return {
      px: cx + x3d * radius * persp,
      py: cy + y3dt * radius * persp,
      z: z3dt,
      size: dot.size * persp,
      isPulsed: pulseWave > 0.6
    };
  });

  projected.sort((a, b) => a.z - b.z);

  for (const p of projected) {
    const da = 0.15 + (p.z + 1) * 0.425;
    if (p.isPulsed) {
      orbCtx.fillStyle = `rgba(6, 182, 212, ${da * 0.9})`;
      orbCtx.shadowColor = 'rgba(6, 182, 212, 0.7)';
      orbCtx.shadowBlur = 12;
    } else {
      orbCtx.fillStyle = `rgba(245, 158, 11, ${da * 0.7})`;
      orbCtx.shadowColor = 'rgba(245, 158, 11, 0.4)';
      orbCtx.shadowBlur = 6;
    }
    orbCtx.beginPath();
    orbCtx.arc(p.px, p.py, p.size, 0, Math.PI * 2);
    orbCtx.fill();
  }

  orbCtx.shadowBlur = 0;

  // Inner glow
  const grad = orbCtx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.8);
  grad.addColorStop(0, 'rgba(245, 158, 11, 0.08)');
  grad.addColorStop(0.5, 'rgba(6, 182, 212, 0.04)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  orbCtx.fillStyle = grad;
  orbCtx.beginPath();
  orbCtx.arc(cx, cy, radius * 0.8, 0, Math.PI * 2);
  orbCtx.fill();
}

// --- STAR FIELD ---
const starsCanvas = document.getElementById('stars');
const starsCtx = starsCanvas.getContext('2d');
starsCanvas.width = 1080 * 2;
starsCanvas.height = 1920 * 2;
starsCtx.scale(2, 2);

const starCount = 300;
const starField = [];
for (let i = 0; i < starCount; i++) {
  starField.push({
    x: Math.random() * 1080,
    y: Math.random() * 1920,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 0.3 + 0.05,
    twinkle: Math.random() * Math.PI * 2,
    color: Math.random() > 0.7 ? '#06b6d4' : '#f59e0b'
  });
}

let starsOpacity = 0;

function drawStars(time) {
  starsCtx.clearRect(0, 0, 1080, 1920);
  starsCtx.globalAlpha = starsOpacity;
  for (const s of starField) {
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(time * s.speed * 3 + s.twinkle));
    starsCtx.globalAlpha = starsOpacity * twinkle;
    starsCtx.fillStyle = s.color;
    starsCtx.beginPath();
    starsCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    starsCtx.fill();
  }
  starsCtx.globalAlpha = 1;
}

// --- SPECIES PORTRAITS for Scene 3 ---
function createPortraitElements() {
  const s3 = document.getElementById('s3');
  const portraits = [
    { src: 'species/chiss.jpg', name: 'CHISS', stats: 'INT +3 • TAKTIK +2', x: -350, delay: 0 },
    { src: 'species/twi-lek.jpg', name: "TWI'LEK", stats: 'CHA +3 • LIST +2', x: 0, delay: 0.3 },
    { src: 'species/togruta.jpg', name: 'TOGRUTA', stats: 'AGI +3 • SINNE +2', x: 350, delay: 0.6 }
  ];

  portraits.forEach((p, i) => {
    const container = document.createElement('div');
    container.className = 'portrait-container';
    container.id = 'portrait' + i;
    container.style.cssText = `
      width: 280px; height: 400px;
      left: ${540 + p.x - 140}px;
      top: 500px;
      opacity: 0;
      transform: translateX(${i === 1 ? '0' : (i === 0 ? '-200px' : '200px')});
      transition: none;
      border-radius: 8px;
    `;
    container.innerHTML = `
      <img src="${p.src}" alt="${p.name}">
      <div class="portrait-overlay"></div>
      <div class="portrait-stat">${p.name}<br><span style="font-size:13px;color:#f59e0b;">${p.stats}</span></div>
    `;
    s3.appendChild(container);
  });
}
createPortraitElements();

// --- SCENE 7: Flash portraits ---
function createFlashPortraits() {
  const s7 = document.getElementById('s7');
  const srcs = ['species/zabrak.jpg', 'species/wookie.jpg', 'species/chiss.jpg'];
  srcs.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'hero-portrait';
    div.id = 'flashPortrait' + i;
    div.innerHTML = `<img src="${src}" alt=""><div class="glow" style="background:radial-gradient(ellipse at center, rgba(6,182,212,0.15) 0%, transparent 70%);"></div>`;
    s7.insertBefore(div, s7.firstChild);
  });
}
createFlashPortraits();

// --- UTILITIES ---
function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }
function easeOut(t) { return 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3); }
function easeIn(t) { return Math.pow(Math.max(0, Math.min(1, t)), 3); }
function easeInOut(t) { t = Math.max(0, Math.min(1, t)); return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function setLayer(id, opacity, extra) {
  const el = document.getElementById(id);
  el.style.opacity = opacity;
  if (extra) Object.assign(el.style, extra);
}

function flash(duration) {
  const el = document.getElementById('flash');
  el.style.opacity = '0.8';
  el.style.transition = `opacity ${duration}s ease-out`;
  requestAnimationFrame(() => { el.style.opacity = '0'; });
}

// --- COUNTER ANIMATION ---
function animateCounter(elementId, target, duration, startTime, currentTime) {
  const elapsed = currentTime - startTime;
  const progress = Math.min(1, elapsed / duration);
  const value = Math.floor(target * easeOut(progress));
  const el = document.getElementById(elementId);
  if (el) el.textContent = value;
}

// --- MAIN TIMELINE ---
let startTime = null;
let audioStarted = false;

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) / 1000;
  const t = elapsed;

  if (t > DURATION + 2) return; // Stop after trailer

  // Start audio
  if (!audioStarted && t > 0.1) {
    const audio = document.getElementById('soundtrack');
    audio.volume = 0.8;
    audio.play().catch(() => {});
    audioStarted = true;
  }

  // --- FADE OVERLAY (initial fade in, final fade out) ---
  const fadeOverlay = document.getElementById('fade-overlay');
  if (t < 1) {
    fadeOverlay.style.opacity = lerp(1, 0, t / 1);
  } else if (t > 24) {
    fadeOverlay.style.opacity = lerp(0, 1, (t - 24) / 1);
  } else {
    fadeOverlay.style.opacity = 0;
  }

  // === SCENE 1: 0-3s — Credit + Orb ===
  if (t < 3) {
    const fadeIn = easeOut(t / 1.5);
    orbX = 540; orbY = 880; orbSize = 500;
    orbOpacity = fadeIn;
    starsOpacity = fadeIn * 0.3;
    setLayer('s1', fadeIn);
    // Fade out at end
    if (t > 2.2) {
      const fo = 1 - easeIn((t - 2.2) / 0.8);
      setLayer('s1', fo);
    }
  }

  // === SCENE 2: 3-6s — Title + Orb shrinks to top ===
  else if (t < 6) {
    const st = t - 3;
    const prog = easeInOut(st / 1.2);
    orbX = lerp(540, 540, prog);
    orbY = lerp(880, 320, prog);
    orbSize = lerp(500, 200, prog);
    orbOpacity = 1;
    starsOpacity = lerp(0.3, 0.8, prog);

    const titleFade = easeOut(st / 1);
    setLayer('s2', titleFade);
    const titleEl = document.querySelector('.title-quantum');
    const subEl = document.querySelector('.title-chronicles');
    if (titleEl) titleEl.style.transform = `translateY(${lerp(40, 0, easeOut(st / 1))}px)`;
    if (subEl) subEl.style.opacity = easeOut((st - 0.4) / 0.8);

    if (st > 2.2) {
      const fo = 1 - easeIn((st - 2.2) / 0.8);
      setLayer('s2', fo);
    }
  }

  // === SCENE 3: 6-9s — Species portraits ===
  else if (t < 9) {
    const st = t - 6;
    orbOpacity = 0.3;
    orbY = 200; orbSize = 150;
    starsOpacity = 0.5;

    setLayer('s3', 1);

    // Slide in portraits
    for (let i = 0; i < 3; i++) {
      const p = document.getElementById('portrait' + i);
      if (p) {
        const delay = i * 0.25;
        const prog = easeOut((st - delay) / 0.6);
        const startX = i === 0 ? -300 : (i === 2 ? 300 : 0);
        p.style.transform = `translateX(${lerp(startX, 0, prog)}px)`;
        p.style.opacity = prog;
      }
    }

    // Flash on entrance
    if (st > 0.05 && st < 0.15) flash(0.3);

    if (st > 2.2) {
      const fo = 1 - easeIn((st - 2.2) / 0.8);
      setLayer('s3', fo);
    }
  }

  // === SCENE 4: 9-12s — AI Game Master (Glitch) ===
  else if (t < 12) {
    const st = t - 9;
    orbOpacity = 0.2;
    starsOpacity = 0.3;

    setLayer('s4', easeOut(st / 0.5));

    // Glitch effect
    const s4 = document.getElementById('s4');
    if (st > 0.3 && st < 1.8) {
      s4.classList.add('glitch-active');
    } else {
      s4.classList.remove('glitch-active');
    }

    // Sub text
    const sub = document.querySelector('.glitch-sub');
    if (sub) sub.style.opacity = easeOut((st - 1) / 0.8);

    if (st > 2.2) {
      const fo = 1 - easeIn((st - 2.2) / 0.8);
      setLayer('s4', fo);
    }

    if (st > 0.05 && st < 0.12) flash(0.2);
  }

  // === SCENE 5: 12-15s — Stats counter ===
  else if (t < 15) {
    const st = t - 12;
    orbOpacity = 0.15;
    starsOpacity = 0.4;

    setLayer('s5', easeOut(st / 0.4));

    // Stagger stat lines
    const statData = [
      { id: 'stat1', numId: 'statNum1', target: 184, delay: 0 },
      { id: 'stat2', numId: 'statNum2', target: 18, delay: 0.5 },
      { id: 'stat3', numId: 'statNum3', target: 71, delay: 1.0 }
    ];

    statData.forEach(sd => {
      const el = document.getElementById(sd.id);
      if (el) {
        const prog = easeOut((st - sd.delay) / 0.6);
        el.style.opacity = prog;
        el.style.transform = `translateY(${lerp(30, 0, prog)}px)`;
      }
      animateCounter(sd.numId, sd.target, 1.2, sd.delay, st);
    });

    if (st > 2.2) {
      const fo = 1 - easeIn((st - 2.2) / 0.8);
      setLayer('s5', fo);
    }
  }

  // === SCENE 6: 15-18s — Hero portrait ===
  else if (t < 18) {
    const st = t - 15;
    orbOpacity = 0;
    starsOpacity = 0.2;

    setLayer('s6', 1);

    // Portrait fade in
    const hp = document.getElementById('heroPortrait');
    hp.style.opacity = easeOut(st / 1);

    // Text lines
    const l1 = document.getElementById('heroLine1');
    const l2 = document.getElementById('heroLine2');
    l1.style.opacity = easeOut((st - 0.5) / 0.6);
    l1.style.transform = `translateY(${lerp(20, 0, easeOut((st - 0.5) / 0.6))}px)`;
    l2.style.opacity = easeOut((st - 1.2) / 0.6);
    l2.style.transform = `translateY(${lerp(20, 0, easeOut((st - 1.2) / 0.6))}px)`;

    if (st > 2.2) {
      const fo = 1 - easeIn((st - 2.2) / 0.8);
      setLayer('s6', fo);
    }

    if (st > 0.05 && st < 0.12) flash(0.3);
  }

  // === SCENE 7: 18-22s — Manifesto + flash portraits ===
  else if (t < 22) {
    const st = t - 18;
    orbOpacity = 0;
    starsOpacity = 0.3;

    setLayer('s7', 1);

    // Flash portraits in sequence
    const flashTimes = [0.0, 0.8, 1.6];
    const flashDur = 0.6;
    for (let i = 0; i < 3; i++) {
      const fp = document.getElementById('flashPortrait' + i);
      if (fp) {
        const ft = st - flashTimes[i];
        if (ft > 0 && ft < flashDur) {
          fp.style.opacity = (1 - ft / flashDur) * 0.5;
        } else {
          fp.style.opacity = 0;
        }
      }
    }

    // Flash on each portrait
    flashTimes.forEach((ft, i) => {
      if (st > ft && st < ft + 0.08) flash(0.2);
    });

    // Text lines stagger
    const mLines = [
      { id: 'mLine1', delay: 0.3 },
      { id: 'mLine2', delay: 1.1 },
      { id: 'mLine3', delay: 1.9 }
    ];
    mLines.forEach(ml => {
      const el = document.getElementById(ml.id);
      if (el) {
        const prog = easeOut((st - ml.delay) / 0.5);
        el.style.opacity = prog;
        el.style.transform = `translateY(${lerp(25, 0, prog)}px)`;
      }
    });

    if (st > 3.2) {
      const fo = 1 - easeIn((st - 3.2) / 0.8);
      setLayer('s7', fo);
    }
  }

  // === SCENE 8: 22-25s — Final title ===
  else if (t <= DURATION + 1) {
    const st = t - 22;
    starsOpacity = lerp(0.3, 1, easeOut(st / 1.5));

    // Orb returns
    const prog = easeOut(st / 1.5);
    orbX = 540; orbY = 700;
    orbSize = lerp(0, 350, prog);
    orbOpacity = lerp(0, 0.6, prog);

    // Pulse the orb
    if (st > 1.5) {
      const pulse = 1 + Math.sin(st * 4) * 0.05;
      orbSize *= pulse;
      orbOpacity = 0.6 + Math.sin(st * 3) * 0.15;
    }

    setLayer('s8', easeOut(st / 1));

    // Title animation
    const titleEl = document.querySelector('.final-title');
    const rpgEl = document.querySelector('.final-rpg');
    const urlEl = document.querySelector('.final-url');
    if (titleEl) {
      titleEl.style.transform = `scale(${lerp(0.8, 1, easeOut(st / 1))})`;
      titleEl.style.opacity = easeOut(st / 0.8);
    }
    if (rpgEl) {
      rpgEl.style.opacity = easeOut((st - 0.3) / 0.8);
    }
    if (urlEl) {
      urlEl.style.opacity = easeOut((st - 0.8) / 0.8);
    }

    if (st > 0.05 && st < 0.15) flash(0.4);

    // Final fade handled by fade overlay
  }

  // --- Draw orb & stars ---
  drawOrb(t);
  drawStars(t);

  requestAnimationFrame(animate);
}

// --- START ---
window.addEventListener('load', () => {
  // Reset all layers
  document.querySelectorAll('.layer').forEach(l => l.style.opacity = 0);
  document.getElementById('fade-overlay').style.opacity = 1;
  requestAnimationFrame(animate);
});

// Auto-start on click (for browsers that block autoplay)
document.addEventListener('click', () => {
  const audio = document.getElementById('soundtrack');
  if (audio.paused) audio.play().catch(() => {});
}, { once: true });
</script>
</body>
</html>
